runtime: nodejs22

instance_class: F2

automatic_scaling:
  min_instances: 0
  max_instances: 10
  target_cpu_utilization: 0.6

env_variables:
  NODE_ENV: production
  LOG_LEVEL: info
  GOOGLE_CLOUD_PROJECT: hankstank
  GCP_PROJECT_ID: hankstank
  GCP_BUCKET_NAME: hanks_tank_data
  BQ_DATASET: mlb_historical_data
  USE_DEFAULT_GCP_CREDENTIALS: true
  CURRENT_SEASON: 2026
  # Football and rankings datasets. The code defaults to these same values, but naming
  # them here keeps production config readable instead of implicit.
  NFL_DATASET: nfl_season
  NFL_HIST_DATASET: nfl_historical
  CFB_DATASET: cfb_season
  CFB_HIST_DATASET: cfb_historical
  MLB_RANKINGS_DATASET: mlb_2026_season
  MIN_SEASON: 2015
  MAX_SEASON: 2026
  # Injected at deploy time from the NEWS_API_KEY env var / GitHub secret.
  # Do not commit a literal value here — this file is public.
  NEWS_API_KEY: __NEWS_API_KEY__
  NEWS_API_BASE_URL: https://newsapi.org/v2
  # Live college scoreboard, schedule and game detail. Substituted at deploy time from
  # Secret Manager (secret: cfbd-api-key) by scripts/render-app-yaml.sh — the same
  # secret the ML pipeline's Cloud Function reads, so there is one copy of the key.
  # Do not commit a literal value here — this file is public.
  CFBD_API_KEY: __CFBD_API_KEY__
  CORS_ORIGIN: https://hankstank.com,https://www.hankstank.com,https://frontend-dot-hankstank.uc.r.appspot.com,http://localhost:3000,http://localhost:3001
  ML_FUNCTION_URL: https://mlb-2026-daily-pipeline-127033547664.us-central1.run.app
  LINEUP_TASK_QUEUE: lineup-pregame
  TASK_QUEUE_LOCATION: us-central1

handlers:
- url: /.*
  script: auto
  secure: always
